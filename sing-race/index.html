<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合唱過關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{
  --bg:#F6F2FF; --card:#FFFFFF; --plum:#3B2F5A; --lilac:#CDB8FF; --pink:#FFC9DE; --sky:#CFE2FF;
  --ink:#2A2140; --muted:#6E6490; --rule:#E4DCF7; --hot:#B4528A; --good:#1F9D62; --bad:#D63C5E; --warn:#D98A1C;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-hud:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;padding:18px 24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100%;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
.top{display:flex;align-items:center;gap:20px}
.top h1{margin:0;font-family:var(--f-hud);font-size:34px;color:var(--plum);line-height:1}
.top h1 small{font-family:var(--f-ui);font-size:18px;color:var(--hot);margin-left:10px;font-weight:900}
.spacer{flex:1}
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:900;font-size:17px}
.btn-main{background:var(--plum);color:#fff}.btn-soft{background:var(--card);border:1.5px solid #CFC4EC;color:var(--plum)}
.btn:disabled{opacity:.4;cursor:default}
.levels{display:flex;gap:10px}
.lv{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:6px 14px;display:grid;gap:2px;min-width:150px}
.lv b{font-size:16px;color:var(--plum)}.lv span{font-size:13px;color:var(--muted)}
.lv.now{border:2px solid var(--plum);background:#FBF9FF}.lv.done{opacity:.55}
.lv.done b::after{content:" ✓";color:var(--good)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 150px;gap:16px}
.track{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.status{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-weight:900;font-size:44px;letter-spacing:.04em;padding:6px 26px;border-radius:999px;background:rgba(255,255,255,.85)}
.status.ok{color:var(--good)}.status.soft{color:var(--warn)}.status.loud{color:var(--bad)}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(246,242,255,.9);text-align:center;padding:24px}
.banner h2{margin:0;font-size:56px;color:var(--plum);font-family:var(--f-hud)}
.banner p{margin:0;font-size:22px;color:var(--muted);max-width:40ch;line-height:1.5}
.banner .big{font-family:var(--f-hud);font-size:120px;color:var(--plum);line-height:1}
.meterbox{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.meterbox .lbl{font-size:13px;color:var(--muted);font-weight:700}
.meter{position:relative;flex:1;width:56px;border-radius:14px;background:#EFEAFB;overflow:hidden}
.meter .band{position:absolute;left:0;right:0;background:rgba(31,157,98,.22);border-top:3px solid var(--good);border-bottom:3px solid var(--good)}
.meter .lvl{position:absolute;left:6px;right:6px;bottom:0;border-radius:10px;background:var(--plum);transition:height .06s linear}
.meter .tag{position:absolute;right:-2px;left:-2px;text-align:center;font-size:12px;font-weight:900;color:var(--good)}
.bottom{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stat{font-family:var(--f-hud);font-size:22px;color:var(--plum)}.stat small{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-right:6px}
details{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 14px}
summary{cursor:pointer;font-weight:700;color:var(--plum)}
.set{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--muted)}
.set input[type=range]{width:180px;accent-color:var(--plum)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>SING RACE<small>合唱過關</small></h1>
    <div class="levels" id="levels"></div>
    <div class="spacer"></div>
    <button class="btn btn-soft" id="calBtn">① 校準</button>
    <button class="btn btn-main" id="goBtn" disabled>② 開始</button>
    <button class="btn btn-soft" id="pauseBtn" disabled>暫停</button>
  </div>
  <div class="main">
    <div class="track">
      <canvas id="cv"></canvas>
      <div class="status" id="status" hidden></div>
      <div class="banner" id="banner">
        <h2>全班一齊唱，跑到終點！</h2>
        <p>聲量喺綠色範圍入面，跑手先會向前跑。<br>太細聲停低，太大聲都會停低。</p>
        <p style="font-size:17px">老師：撳「① 校準」→ 播住伴奏、全班唔好出聲 5 秒 → 再撳「② 開始」</p>
      </div>
    </div>
    <div class="meterbox">
      <span class="lbl">太大聲</span>
      <div class="meter" id="meter"><div class="band" id="band"></div><div class="lvl" id="lvl"></div></div>
      <span class="lbl">太細聲</span>
    </div>
  </div>
  <div class="bottom">
    <span class="stat"><small>時間</small><span id="tTime">0.0</span>s</span>
    <span class="stat"><small>剛好</small><span id="tGood">0</span>%</span>
    <span class="stat"><small>進度</small><span id="tProg">0</span>%</span>
    <div class="spacer"></div>
    <details>
      <summary>老師設定</summary>
      <div class="set">綠色範圍下限 <input type="range" id="lo" min="5" max="90" value="0"><span id="loV"></span></div>
      <div class="set">綠色範圍上限 <input type="range" id="hi" min="10" max="99" value="0"><span id="hiV"></span></div>
      <div class="set">每關距離 <input type="range" id="dist" min="10" max="60" value="25"><span id="distV"></span> 秒（全部剛好時）</div>
    </details>
  </div>
</div>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
// Three stages. Band offsets are relative to the calibrated background (music + silent room), on a 0–100 loudness scale.
const LEVELS = [
  {name:"第 1 關", sub:"正常聲量 mf", lo:12, hi:34},
  {name:"第 2 關", sub:"細聲 p",       lo:6,  hi:18},
  {name:"第 3 關", sub:"大聲 f（唔好嗌）", lo:22, hi:40},
];
let base = null, lvl = 0, prog = 0, tTotal = 0, tGood = 0, state = "idle", lastT = 0, cur = 0, smooth = 0;
let band = {lo:0, hi:0}, runnerPhase = 0, mood = "idle";
const cv = $("cv"), g = cv.getContext("2d");
function renderLevels(){
  const box = $("levels"); box.textContent = "";
  LEVELS.forEach((L,i) => { const d = document.createElement("div"); d.className = "lv" + (i===lvl && state!=="idle" ? " now" : "") + (i<lvl || state==="won" ? " done" : "");
    d.innerHTML = `<b>${L.name}</b><span>${L.sub}</span>`; box.appendChild(d); });
}
renderLevels();

/* ---------- mic ---------- */
let ctx, an, buf;
async function initMic(){
  if (an) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume();
    const src = ctx.createMediaStreamSource(stream); an = ctx.createAnalyser(); an.fftSize = 2048; src.connect(an); buf = new Float32Array(an.fftSize);
    return true;
  } catch (e) { alert("用唔到咪：請喺瀏覽器網址列旁邊允許使用咪，再撳一次「校準」。"); return false; }
}
function level(){
  if (!an) return 0; an.getFloatTimeDomainData(buf); let s = 0; for (let i=0;i<buf.length;i++) s += buf[i]*buf[i];
  const db = 20*Math.log10(Math.sqrt(s/buf.length) + 1e-9);         // about -90 .. 0 dBFS
  return Math.max(0, Math.min(100, (db + 70) * 100/60));            // -70 dB → 0, -10 dB → 100
}

/* ---------- settings ---------- */
function setBand(L){
  const b = base ?? 20; band.lo = Math.min(95, b + L.lo); band.hi = Math.min(99, b + L.hi);
  $("lo").value = band.lo; $("hi").value = band.hi; showBand();
}
function showBand(){
  $("loV").textContent = Math.round(band.lo); $("hiV").textContent = Math.round(band.hi);
  $("band").style.bottom = band.lo + "%"; $("band").style.height = Math.max(2, band.hi - band.lo) + "%";
}
$("lo").oninput = e => { band.lo = Math.min(+e.target.value, band.hi - 3); showBand(); };
$("hi").oninput = e => { band.hi = Math.max(+e.target.value, band.lo + 3); showBand(); };
$("dist").oninput = e => $("distV").textContent = e.target.value; $("distV").textContent = $("dist").value;

/* ---------- calibrate / flow ---------- */
$("calBtn").onclick = async () => {
  if (!(await initMic())) return;
  state = "cal"; const ban = $("banner"); ban.hidden = false;
  ban.innerHTML = `<h2>校準中</h2><p>播住伴奏，全班唔好出聲</p><div class="big" id="calN">5</div>`;
  const vals = []; const t0 = performance.now();
  const iv = setInterval(() => { vals.push(level()); const left = 5 - Math.floor((performance.now()-t0)/1000); const n = $("calN"); if (n) n.textContent = Math.max(1,left);
    if (performance.now() - t0 > 5000) { clearInterval(iv); vals.sort((a,b)=>a-b); base = vals[Math.floor(vals.length*.8)] || 20;
      state = "ready"; lvl = 0; setBand(LEVELS[0]); $("goBtn").disabled = false;
      ban.innerHTML = `<h2>準備好！</h2><p>${LEVELS[0].name}：${LEVELS[0].sub}<br>撳「② 開始」</p>`; renderLevels(); } }, 50);
};
$("goBtn").onclick = () => {
  if (state === "won" || state === "ready") { if (state === "won") { lvl = 0; } prog = 0; tTotal = 0; tGood = 0; setBand(LEVELS[lvl]); }
  countdown(() => { state = "run"; lastT = performance.now(); $("pauseBtn").disabled = false; });
};
$("pauseBtn").onclick = () => {
  if (state === "run") { state = "pause"; $("pauseBtn").textContent = "繼續"; $("banner").hidden = false; $("banner").innerHTML = `<h2>暫停</h2>`; }
  else if (state === "pause") { $("pauseBtn").textContent = "暫停"; countdown(() => { state = "run"; lastT = performance.now(); }); }
};
function countdown(done){
  const ban = $("banner"); ban.hidden = false; let n = 3; ban.innerHTML = `<p>${LEVELS[lvl].name}：${LEVELS[lvl].sub}</p><div class="big">${n}</div>`;
  state = "count"; renderLevels();
  const iv = setInterval(() => { n--; if (n > 0) ban.querySelector(".big").textContent = n; else { clearInterval(iv); ban.hidden = true; done(); } }, 800);
}
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); $("pauseBtn").click(); } });

/* ---------- loop ---------- */
function frame(t){
  const raw = level(); smooth += (raw - smooth) * 0.18; cur = smooth;
  $("lvl").style.height = cur + "%";
  if (state === "run") {
    const dt = Math.min(.1, (t - lastT)/1000); lastT = t; tTotal += dt;
    const inBand = cur >= band.lo && cur <= band.hi;
    mood = inBand ? "ok" : (cur > band.hi ? "loud" : "soft");
    if (inBand) { tGood += dt; prog += dt / +$("dist").value; runnerPhase += dt * 9; }
    const st = $("status"); st.hidden = false; st.className = "status " + mood;
    st.textContent = mood === "ok" ? "剛好！向前跑" : mood === "loud" ? "太大聲！停低" : "大聲啲！";
    if (prog >= 1) { prog = 1; levelDone(); }
  } else if (state !== "run") { $("status").hidden = true; mood = "idle"; }
  $("tTime").textContent = tTotal.toFixed(1); $("tGood").textContent = tTotal ? Math.round(100*tGood/tTotal) : 0; $("tProg").textContent = Math.round(prog*100);
  draw(t); requestAnimationFrame(frame);
}
function levelDone(){
  state = "between"; $("pauseBtn").disabled = true;
  const ban = $("banner"); ban.hidden = false;
  if (lvl < LEVELS.length - 1) {
    lvl++; setBand(LEVELS[lvl]); prog = 0;
    ban.innerHTML = `<h2>過關！</h2><p>下一關：${LEVELS[lvl].name}・${LEVELS[lvl].sub}</p><p style="font-size:16px">撳「② 開始」繼續</p>`;
    state = "ready";
  } else {
    state = "won";
    ban.innerHTML = `<h2>全部過關！</h2><p>總時間 ${tTotal.toFixed(1)} 秒・剛好聲量 ${Math.round(100*tGood/tTotal)}%</p><p style="font-size:16px">撳「② 開始」由第 1 關再嚟</p>`;
  }
  renderLevels();
}

/* ---------- drawing ---------- */
function draw(t){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width*dpr) || cv.height !== Math.round(r.height*dpr)) { cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); }
  const W = r.width, Hh = r.height; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,Hh);
  const ground = Hh*0.72, x0 = 70, x1 = W - 90;
  // lanes
  g.fillStyle = "#F3EEFF"; g.fillRect(0, ground, W, Hh - ground);
  g.strokeStyle = "#E4DCF7"; g.lineWidth = 2;
  for (let i = 0; i < 3; i++) { const y = ground + 16 + i*((Hh-ground-24)/3); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  // distance ticks (scroll with runner phase)
  g.fillStyle = "#CDB8FF";
  const off = (prog * 1200) % 80;
  for (let x = -off; x < W; x += 80) g.fillRect(x, ground - 4, 30, 4);
  // checkpoints: 3 gates per level
  for (let k = 1; k <= 3; k++) {
    const gx = x0 + (x1 - x0) * (k/3); const passed = prog >= k/3;
    g.fillStyle = passed ? "#1F9D62" : "#B4528A"; g.fillRect(gx - 3, ground - 120, 6, 120);
    g.fillStyle = passed ? "#BDEBD6" : "#FFC9DE"; g.fillRect(gx + 3, ground - 120, 44, 26);
    g.fillStyle = "#3B2F5A"; g.font = "700 14px 'Chakra Petch', sans-serif"; g.fillText(k === 3 ? "終點" : `${k}/3`, gx + 9, ground - 102);
  }
  // runner
  const rx = x0 + (x1 - x0) * prog, ry = ground;
  drawRunner(rx, ry, mood === "ok" ? runnerPhase : 0, mood);
  // progress text
  g.fillStyle = "#6E6490"; g.font = "700 18px 'Noto Sans TC', sans-serif";
  g.fillText(`${LEVELS[lvl].name}・${LEVELS[lvl].sub}`, 24, 40);
}
function drawRunner(x, y, ph, md){
  const col = md === "loud" ? "#D63C5E" : md === "soft" ? "#D98A1C" : "#3B2F5A";
  const s = 1.25, sw = Math.sin(ph), cw = Math.cos(ph);
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = col; g.fillStyle = col; g.lineCap = "round"; g.lineWidth = 7;
  const hip = [0, -46], sh = [6, -86];
  const leg = (a) => { const kx = hip[0] + 14*Math.sin(a), ky = hip[1] + 22, fx = kx + 10*Math.sin(a - .9), fy = 0 - Math.max(0, 8*Math.cos(a)); g.beginPath(); g.moveTo(...hip); g.lineTo(kx, ky); g.lineTo(fx, fy); g.stroke(); };
  const arm = (a) => { const ex = sh[0] - 14*Math.sin(a), ey = sh[1] + 18, hx = ex + 12*Math.cos(a), hy = ey + 6; g.beginPath(); g.moveTo(...sh); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke(); };
  if (md === "ok") { leg(ph); leg(ph + Math.PI); arm(ph + Math.PI); arm(ph); }
  else { g.beginPath(); g.moveTo(...hip); g.lineTo(-6, -22); g.lineTo(-6, 0); g.moveTo(...hip); g.lineTo(8, -22); g.lineTo(8, 0); g.stroke();
         g.beginPath(); g.moveTo(...sh); g.lineTo(-10, -62); g.moveTo(...sh); g.lineTo(20, -64); g.stroke(); }
  g.beginPath(); g.moveTo(...hip); g.lineTo(...sh); g.stroke();
  g.beginPath(); g.arc(10, -102, 11, 0, Math.PI*2); g.fill();
  g.restore();
  if (md === "ok") { g.fillStyle = "rgba(205,184,255,.6)"; for (let i = 1; i <= 3; i++) g.fillRect(x - 30 - i*14, y - 70 + i*10 + 3*Math.sin(ph+i), 18, 4); }
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
